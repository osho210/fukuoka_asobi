name: Chromatic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  chromatic:
    name: Chromatic - ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        app:
          - name: Frontend
            dir: frontend
            projectToken: CHROMATIC_PROJECT_TOKEN_FRONTEND
          - name: Admin
            dir: admin
            projectToken: CHROMATIC_PROJECT_TOKEN_ADMIN

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./${{ matrix.app.dir }}

      - name: Run Chromatic
        uses: chromaui/action@v11
        with:
          # matrix で指定した環境変数名の secret を読む
          projectToken: ${{ secrets[matrix.app.projectToken] }}
          # GitHub と連携するためのトークン（PR コメントや Checks に必要）
          token: ${{ secrets.GITHUB_TOKEN }}
          # monorepo の該当アプリディレクトリ
          workingDir: ${{ matrix.app.dir }}
          # 差分を自動で承認して baseline 更新したい場合はコメントアウト外す
          autoAcceptChanges: true
