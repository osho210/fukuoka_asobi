version: 2
updates:
  # Bundler (Ruby/Rails backend)
  - package-ecosystem: bundler
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

    pull-request-branch-name:
      prefix: "deps/bundler"
      separator: "/"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"
      - "bot"

  # npm (manages root + all workspaces: frontend, admin)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

    pull-request-branch-name:
      separator: "/"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"
      - "bot"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

    pull-request-branch-name:
      prefix: "deps/gh-actions"
      separator: "/"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"
      - "bot"
