  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

    pull-request-branch-name:
      prefix: "deps/gh-actions"
      separator: "/"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"
      - "bot"
