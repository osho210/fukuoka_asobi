version: 2
updates:
  # Bundler (Ruby/Rails backend)
  - package-ecosystem: bundler
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

    pull-request-branch-name:
      prefix: "deps/bundler"
      separator: "/"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"
      - "bot"

  # npm (root workspace)
  - package-ecosystem: npm
    directory: "/"
