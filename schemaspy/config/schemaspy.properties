# SchemaSpy 設定ファイル

# データベース接続設定
# これらはdocker-compose.ymlのコマンドラインで上書きされます
schemaspy.t=mysql
schemaspy.host=db
schemaspy.port=3306
schemaspy.db=fukuoka_asobi_development
schemaspy.u=rails
schemaspy.p=rails

# 出力設定
schemaspy.o=/output
schemaspy.vizjs=true

# テーブル設定
# 特定のテーブルのみを含める場合は以下のようにカンマ区切りで指定
# schemaspy.i=table1,table2

# 特定のテーブルを除外する場合は以下のようにカンマ区切りで指定
# schemaspy.I=table3,table4

# スキーマ設定
schemaspy.s=fukuoka_asobi_development

# その他の設定
# 詳細なログを出力
schemaspy.debug=true

# 関係のないテーブルを非表示にする
schemaspy.noorphans=true

# 列の詳細を表示
schemaspy.norows=true

# 日本語対応
schemaspy.charset=UTF-8

# 生成するHTMLのタイトル
schemaspy.name=福岡遊び日記 データベース設計
# schemaspy.meta パラメータは削除（メタデータファイルが必要な場合は後で追加）
