databases:
  - name: fukuoka_asobi_staging
    databaseName: fukuoka_asobi_production
    user: fukuoka_asobi
    region: singapore
  - name: fukuoka_asobi_staging_cache
    databaseName: fukuoka_asobi_production_cache
    user: fukuoka_asobi
    region: singapore
  - name: fukuoka_asobi_staging_queue
    databaseName: fukuoka_asobi_production_queue
    user: fukuoka_asobi
    region: singapore
  - name: fukuoka_asobi_staging_cable
    databaseName: fukuoka_asobi_production_cable
    user: fukuoka_asobi
    region: singapore

services:
  - type: web
    name: fukuoka-asobi-staging
    env: ruby
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "./bin/render-build.sh"
    # ← 起動時に Ridgepole を流す（DB準備は起動時が安全）
    startCommand: >
      bundle exec ridgepole -c config/database.yml -E production --apply -f db/schemas/Schemafile
      && bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fukuoka_asobi_staging
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: fukuoka_asobi_staging_cache
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: fukuoka_asobi_staging_queue
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: fukuoka_asobi_staging_cable
          property: connectionString

      # Rails / Build
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      - key: NODE_ENV
        value: production
      - key: AWS_EC2_METADATA_DISABLED
        value: "true"

      # Devise / JWT (ENVのみ参照にした場合)
      - key: DEVISE_SECRET_KEY
        sync: false
      - key: DEVISE_JWT_SECRET_KEY
        sync: false

      # ActiveStorage を一時的にローカルで動かすなら
      - key: ACTIVE_STORAGE_SERVICE
        value: local
