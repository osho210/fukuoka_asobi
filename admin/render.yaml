databases:
  - name: fukuoka_asobi_staging
    databaseName: fukuoka_asobi_production
    user: fukuoka_asobi
    region: singapore
  - name: fukuoka_asobi_staging_cache
    databaseName: fukuoka_asobi_production_cache
    user: fukuoka_asobi
    region: singapore
  - name: fukuoka_asobi_staging_queue
    databaseName: fukuoka_asobi_production_queue
    user: fukuoka_asobi
    region: singapore
  - name: fukuoka_asobi_staging_cable
    databaseName: fukuoka_asobi_production_cable
    user: fukuoka_asobi
    region: singapore

services:
  - type: web
    name: fukuoka-asobi-staging
    env: ruby
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fukuoka_asobi_staging
          property: connectionString
      - key: FUKUOKA_ASOBI_DATABASE_PASSWORD
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
