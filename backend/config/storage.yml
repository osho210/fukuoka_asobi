test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# 開発環境用Minio設定
minio:
  service: S3
  access_key_id: minioadmin
  secret_access_key: minioadmin
  region: us-east-1
  endpoint: 'http://minio:9000'
  force_path_style: true
  bucket: fukuoka-asobi-dev
  public: true

# 本番環境用MinIO設定
minio_production:
  service: S3
  access_key_id: <%= ENV.fetch("MINIO_ROOT_USER") %>
  secret_access_key: <%= ENV.fetch("MINIO_ROOT_PASSWORD") %>
  region: us-east-1
  endpoint: "http://fukuoka-asobi-backend-minio:9000"
  force_path_style: true
  bucket: fukuoka-asobi-production
  public: false

# 本番環境用S3設定（将来の拡張用）
# TODO: 本番環境では、S3バケットを公開設定にし、CDN（CloudFrontなど）を経由して画像を配信する
