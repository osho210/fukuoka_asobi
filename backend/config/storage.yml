test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# 開発環境用MinIO設定
minio:
  service: S3
  access_key_id: <%= ENV.fetch("MINIO_ROOT_USER", "minioadmin") %>
  secret_access_key: <%= ENV.fetch("MINIO_ROOT_PASSWORD", "minioadmin") %>
  region: us-east-1
  endpoint: <%= ENV.fetch("MINIO_ENDPOINT", "http://minio:9000") %>
  force_path_style: true
  bucket: <%= ENV.fetch("MINIO_BUCKET", "fukuoka-asobi-dev") %>
  public: true

# 本番環境用MinIO設定（廃止予定 - R2移行完了・動作確認後に削除）
minio_production:
  service: S3
  access_key_id: <%= ENV.fetch("MINIO_ROOT_USER", "") %>
  secret_access_key: <%= ENV.fetch("MINIO_ROOT_PASSWORD", "") %>
  region: us-east-1
  endpoint: <%= ENV.fetch("MINIO_ENDPOINT", "") %>
  force_path_style: true
  bucket: <%= ENV.fetch("MINIO_BUCKET", "fukuoka-asobi-production") %>
  public: false

# 本番環境用Cloudflare R2設定
r2_production:
  service: S3
  access_key_id: <%= ENV.fetch("R2_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("R2_SECRET_ACCESS_KEY", "") %>
  region: auto
  endpoint: <%= ENV.fetch("R2_ENDPOINT", "") %>
  force_path_style: true
  bucket: <%= ENV.fetch("R2_BUCKET", "fukuoka-asobi-production") %>
  public: false
  # ✅ 追加（R2のchecksumエラー対策）
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"

