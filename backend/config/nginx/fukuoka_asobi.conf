# Nginx configuration for Fukuoka Asobi on ConoHa VPS
# Place this file at: /etc/nginx/sites-available/fukuoka_asobi
# Then create symlink: sudo ln -s /etc/nginx/sites-available/fukuoka_asobi /etc/nginx/sites-enabled/

upstream puma {
  server unix:///var/www/fukuoka_asobi/shared/tmp/sockets/puma.sock;
}

server {
  listen 80;
  server_name REPLACE_WITH_YOUR_DOMAIN.com;  # ⚠️ 必須: 実際のドメインに変更してください

  root /var/www/fukuoka_asobi/current/backend/public;
  
  # ログファイル
  access_log /var/www/fukuoka_asobi/shared/log/nginx_access.log;
  error_log  /var/www/fukuoka_asobi/shared/log/nginx_error.log;

  # クライアントの最大アップロードサイズ（画像アップロード用）
  client_max_body_size 10M;

  # 静的ファイルの配信
  location ~ ^/(assets|packs|uploads)/ {
    gzip_static on;
    expires max;
    add_header Cache-Control public;
    try_files $uri =404;
  }

  # ActiveStorage の blob ファイル
  location ~ ^/rails/active_storage/ {
    proxy_pass http://puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # その他のリクエストは Puma に転送
  location / {
    proxy_pass http://puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket サポート
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # タイムアウト設定
    proxy_connect_timeout 60;
    proxy_send_timeout 60;
    proxy_read_timeout 60;
  }

  # ヘルスチェックエンドポイント
  location /up {
    proxy_pass http://puma;
    proxy_set_header Host $host;
    access_log off;
  }

  # エラーページ
  error_page 500 502 503 504 /500.html;
  location = /500.html {
    root /var/www/fukuoka_asobi/current/backend/public;
  }
}

