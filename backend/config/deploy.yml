# Name of your application. Used to uniquely configure containers.
service: fukuoka-asobi-backend

# Name of the container image.
# GitHub Container Registry: ghcr.io/<github-user-or-org>/fukuoka-asobi-backend
image: ghcr.io/osho210/fukuoka-asobi-backend

# Deploy to these servers.
# ConoHa VPS の IP アドレスを環境変数から注入
servers:
  web:
    - <%= ENV["CONOHA_VPS_IP"] %>

ssh:
  user: deploy
  port: 10022

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
proxy:
  ssl: true
  host: 'fukuoka-asobi.com'  # ConoHa VPS に紐付けたドメイン名

# Credentials for your image host.
registry:
  server: ghcr.io
  username: <%= ENV["KAMAL_REGISTRY_USER"] %>
  password: <%= ENV["KAMAL_REGISTRY_PASSWORD"] %>

# Inject ENV variables into containers
env:
  secret:
    RAILS_MASTER_KEY:     <%= ENV["RAILS_MASTER_KEY"] %>
    SECRET_KEY_BASE:      <%= ENV["SECRET_KEY_BASE"] %>
    DB_PASSWORD:          <%= ENV["DB_PASSWORD"] %>
    MINIO_ROOT_PASSWORD:  <%= ENV["MINIO_ROOT_PASSWORD"] %>

  clear:
    # Rails 環境
    RAILS_ENV: production

    # Solid Queue を web コンテナ内で動かす
    SOLID_QUEUE_IN_PUMA: true

    # DB 接続設定（Kamal accessories の db を使用）
    DB_HOST: fukuoka-asobi-backend-db
    DB_PORT: 3306
    DB_USERNAME: fukuoka_asobi
    DB_NAME: fukuoka_asobi_production

    # MinIO 設定（Kamal accessories の minio を使用）
    MINIO_ENDPOINT: http://fukuoka-asobi-backend-minio:9000
    MINIO_ROOT_USER: fukuoka_asobi
    # Active Storage 設定
    ACTIVE_STORAGE_SERVICE: minio

# Aliases
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole"

# Use a persistent storage volume for Active Storage files.
volumes:
  - "fukuoka_asobi_storage:/rails/storage"

# Bridge fingerprinted assets (JS/CSS) between versions
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64
  # CI 上の GitHub Actions で build するので remote は不要

# Accessories: MySQL & MinIO
accessories:
  db:
    image: mysql:8.0
    host: <%= ENV["CONOHA_VPS_IP"] %>
    port: 3306
    env:
      clear:
        MYSQL_ROOT_HOST: '%'
        MYSQL_DATABASE:  fukuoka_asobi_production
        MYSQL_USER:      fukuoka_asobi
        MYSQL_PASSWORD:  <%= ENV["DB_PASSWORD"] %>
        MYSQL_ROOT_PASSWORD: <%= ENV["MYSQL_ROOT_PASSWORD"] %>
    cmd: --default-authentication-plugin=mysql_native_password
    directories:
      - data:/var/lib/mysql

  minio:
    image: minio/minio
    host: <%= ENV["CONOHA_VPS_IP"] %>
    port: 9000
    env:
      clear:
        MINIO_ROOT_USER:     fukuoka_asobi
        MINIO_ROOT_PASSWORD: <%= ENV["MINIO_ROOT_PASSWORD"] %>
    cmd: server /data --console-address ":9001"
    directories:
      - data:/data
