query GetPlayPlans($limit: Int) {
  playPlans(limit: $limit) {
    id
    planName
    description
    imageUrl
    location
    tripType
    totalBudget
    rating
    reviewCount
    favoriteCount
    status
    user {
      id
      username
      profileImageUrl
      role
    }
  }
}

query GetPlayPlan($id: ID!) {
  playPlan(id: $id) {
    id
    planName
    description
    imageUrl
    location
    tripType
    totalBudget
    rating
    reviewCount
    favoriteCount
    status
    startDatetime
    endDatetime
    tags
    recommendedFor
    planDetails {
      id
      stepNumber
      stepName
      stepDescription
      comment
      startDatetime
      endDatetime
      budget
      notes
      spot {
        id
        storeName
        address
        catchphrase
      }
    }
  }
}
