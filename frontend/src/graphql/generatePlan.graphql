mutation GeneratePlan($input: GeneratePlanInput!) {
  generatePlan(input: $input) {
    plan {
      id
      planName
      description
      totalBudget
      startDatetime
      endDatetime
      planDetails {
        id
        stepNumber
        stepName
        stepDescription
        startDatetime
        endDatetime
        budget
        spot {
          id
          spotName
          address
          catchphrase
          imageUrl
        }
        travelDetails {
          sequenceNumber
          travelMethod
          travelTime
        }
      }
      travelRoute {
        totalDistance
        totalTravelTime
        travelSegments {
          fromSpot {
            id
            spotName
          }
          toSpot {
            id
            spotName
          }
          distance
          travelTime
          travelMethod
        }
      }
    }
    errors
  }
}
